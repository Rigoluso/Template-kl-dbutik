<VirtualHost *:80>
    DocumentRoot /var/www/shop
    ErrorLog /proc/self/fd/2
    ErrorLogFormat "[%t] [%l] %M"
    # %U excludes the query string. No IP, referrer, cookies or authorization.
    LogFormat "%m %U %>s %B %D" shop_private
    CustomLog /proc/self/fd/1 shop_private
    <Directory /var/www/shop>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    <Directory /var/www/shop/wp-content/uploads>
        AllowOverride None
        <FilesMatch "(?i)\.(php[0-9]?|phtml|phar|cgi|pl|sh|html?|svg)$">
            Require all denied
        </FilesMatch>
    </Directory>
</VirtualHost>
