events {}
http {
    server {
        listen 80;
        location = /health.php { return 200 'ready'; }
        location / {
            default_type application/json;
            return 200 '{"host":"$http_host","forwarded_host":"$http_x_forwarded_host","forwarded_for":"$http_x_forwarded_for","forwarded_proto":"$http_x_forwarded_proto","real_ip":"$http_x_real_ip","forwarded":"$http_forwarded","proxy":"$http_proxy"}';
        }
    }
}
