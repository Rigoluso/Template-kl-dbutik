name: Test and publish containers
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified application image to this repository's GHCR package
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Run real dynamic NGINX stack and persistence checks
        run: |
          sh scripts/setup.sh --demo
          sh tests/run-containers.sh
      - name: Run NGINX HTTP/TLS and header tests
        run: python3 deploy/tests/test_nginx.py
      - name: Collect diagnostics without secrets
        if: failure()
        run: docker compose --project-name shopverify -f compose.yaml -f compose.dev.yaml logs --tail 120
      - name: Remove only this job's test containers
        if: always()
        run: docker compose --project-name shopverify -f compose.yaml -f compose.dev.yaml down --volumes
  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: release
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          python3 - <<'PY'
          import json, os, re
          version = json.load(open('dependencies.lock.json'))['template_version']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version): raise SystemExit('Invalid release version')
          if os.environ['REF_TYPE'] == 'tag' and os.environ['REF_NAME'] != 'v' + version:
              raise SystemExit('Git tag must match dependencies.lock.json template_version')
          image = 'ghcr.io/' + os.environ['REPOSITORY'].lower() + ':' + version
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output: output.write('image=' + image + '\n')
          PY
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.image }}
          provenance: true
          sbom: true
      - name: Confirm published manifest before reporting address
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE"
          printf '%s\n' "SHOP_APP_IMAGE=$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
