name: ${COMPOSE_PROJECT_NAME:-kladbutik}

x-app: &app
  image: ${SHOP_APP_IMAGE:?Set SHOP_APP_IMAGE to the published versioned application image; use .env.demo.example for a local build.}
  restart: unless-stopped
  read_only: true
  security_opt: [no-new-privileges:true]
  environment: &app-env
    WORDPRESS_DB_HOST: db:3306
    WORDPRESS_DB_NAME: ${SHOP_DB_NAME:-shop}
    WORDPRESS_DB_USER: ${SHOP_DB_USER:-shop}
    WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_password
    SHOP_SECRET_FILE: /run/secrets/shop_secret
    SHOP_MODE: ${SHOP_MODE:-production}
    SHOP_URL: ${SHOP_URL:?Set SHOP_URL to the canonical public URL.}
    SHOP_DOMAIN: ${SHOP_DOMAIN:?Set SHOP_DOMAIN.}
    SHOP_TRUSTED_PROXY: ${SHOP_PROXY_IP:-172.30.72.2}
    SHOP_PRIVATE_DIR: /var/shop-private
    SHOP_CHECKOUT_ENABLED: "0"
    SHOP_SMTP_HOST: ${SHOP_SMTP_HOST:-}
    SHOP_SMTP_PORT: ${SHOP_SMTP_PORT:-587}
    SHOP_SMTP_USER: ${SHOP_SMTP_USER:-}
    SHOP_SMTP_FROM: ${SHOP_SMTP_FROM:-}
  secrets: [db_password, shop_secret]
  volumes:
    - uploads:/var/www/shop/wp-content/uploads
    - private:/var/shop-private
  tmpfs:
    - /tmp:mode=1777,size=256m
    - /var/run/apache2:mode=755,size=16m
    - /var/lock/apache2:mode=755,size=16m
  networks: [database, outbound]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  db:
    image: mariadb:11.4.13@sha256:1292844148b311e4ed4300022a996d39083f415a963e970cf47cad1b3b18e3a6
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      MARIADB_DATABASE: ${SHOP_DB_NAME:-shop}
      MARIADB_USER: ${SHOP_DB_USER:-shop}
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets: [db_password, db_root_password]
    volumes: [database:/var/lib/mysql]
    networks: [database]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  migrate:
    <<: *app
    restart: "no"
    command: [/opt/shop/migrate.sh]
    environment:
      <<: *app-env
      SHOP_ADMIN_USER: ${SHOP_ADMIN_USER:-shopadmin}
      SHOP_ADMIN_EMAIL: ${SHOP_ADMIN_EMAIL:?Set SHOP_ADMIN_EMAIL.}
      SHOP_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    secrets: [db_password, shop_secret, admin_password]
    depends_on:
      db: {condition: service_healthy}

  app:
    <<: *app
    networks: [frontend, database, outbound]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "5", http://127.0.0.1/health.php]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 60s
    stop_grace_period: 120s

  worker:
    <<: *app
    command: [/opt/shop/worker.sh]
    # The Apache base image uses SIGWINCH; the CLI worker handles SIGTERM.
    stop_signal: SIGTERM
    depends_on:
      app: {condition: service_healthy}
    healthcheck:
      test: [CMD, /opt/shop/worker-health.sh]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    stop_grace_period: 120s

  nginx:
    image: nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    restart: unless-stopped
    entrypoint: [/bin/sh, /opt/shop-nginx/entrypoint.sh]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, CHOWN, DAC_OVERRIDE]
    environment:
      SHOP_MODE: ${SHOP_MODE:-production}
      SHOP_DOMAIN: ${SHOP_DOMAIN:?Set SHOP_DOMAIN.}
      SHOP_WWW_DOMAIN: ${SHOP_WWW_DOMAIN:-}
    ports:
      - "${SHOP_HTTP_BIND:-0.0.0.0}:${SHOP_HTTP_PORT:-80}:80"
      - "${SHOP_HTTPS_BIND:-0.0.0.0}:${SHOP_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx:/opt/shop-nginx:ro
      - acme:/var/www/acme:ro
      - certificates:/etc/letsencrypt:ro
    tmpfs:
      - /tmp:mode=1777,size=16m
      - /var/cache/nginx:mode=755,size=128m
    networks:
      frontend: {ipv4_address: "${SHOP_PROXY_IP:-172.30.72.2}"}
      edge: {}
    depends_on:
      app: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8081/nginx-health]
      interval: 10s
      timeout: 3s
      retries: 3
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  certbot:
    image: certbot/certbot:v5.8.0@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20
    restart: unless-stopped
    entrypoint: [/bin/sh, /opt/shop-certbot/renew.sh]
    security_opt: [no-new-privileges:true]
    environment:
      SHOP_MODE: ${SHOP_MODE:-production}
      SHOP_DOMAIN: ${SHOP_DOMAIN:?Set SHOP_DOMAIN.}
      SHOP_WWW_DOMAIN: ${SHOP_WWW_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_STAGING: ${ACME_STAGING:-0}
    volumes:
      - ./deploy/certbot:/opt/shop-certbot:ro
      - acme:/var/www/acme
      - certificates:/etc/letsencrypt
    networks: [edge]
    depends_on:
      nginx: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

secrets:
  db_password: {file: "${SHOP_DB_PASSWORD_PATH:-./secrets/db_password}"}
  db_root_password: {file: "${SHOP_DB_ROOT_PASSWORD_PATH:-./secrets/db_root_password}"}
  admin_password: {file: "${SHOP_ADMIN_PASSWORD_PATH:-./secrets/admin_password}"}
  shop_secret: {file: "${SHOP_SECRET_PATH:-./secrets/shop_secret}"}

volumes:
  database:
  uploads:
  private:
  acme:
  certificates:

networks:
  # Neither MariaDB nor Apache has published host ports.
  database: {internal: true}
  frontend:
    internal: true
    ipam:
      config:
        - subnet: "${SHOP_PROXY_SUBNET:-172.30.72.0/24}"
          # Reserve the lower half for static addresses; avoid Docker allocating
          # NGINX's .2 address to app before the proxy is created.
          ip_range: "${SHOP_PROXY_DYNAMIC_RANGE:-172.30.72.128/25}"
  outbound: {}
  edge: {}
